# ==============================================================================
# railway.toml — Wilinwi API (NestJS 11 · Turborepo monorepo)
# @author @hopsyder | Nexus Partners
# @description Configuration de déploiement Railway pour apps/api
# Schéma de référence : https://docs.railway.com/reference/config-as-code
# ==============================================================================

[build]
# Build depuis la RACINE du monorepo (Turborepo a besoin du context global).
# Railway exécute cette commande depuis la racine du dépôt.
builder = "NIXPACKS"
buildCommand = "pnpm install --frozen-lockfile && pnpm --filter @wilinwi/db generate && pnpm --filter @wilinwi/types build && pnpm --filter api build"

[deploy]
# node dist/main.js relatif à la racine du monorepo (nest build → apps/api/dist/).
startCommand = "node apps/api/dist/main.js"

# Politique de redémarrage automatique si le process plante.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Health-check : Railway sonde /api/health après chaque déploiement.
# Assure-toi qu'un endpoint GET /api/health existe (retourne 200 suffit).
healthcheckPath = "/api/health"
healthcheckTimeout = 30
